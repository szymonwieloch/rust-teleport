[package]
name = "teleport"
version = "0.1.0"
authors = ["szymonwieloch <szymon.wieloch@gmail.com>"]
edition = "2024"

build = "build.rs"

[dependencies]
tonic = {version="0.12",  features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
futures-core="0.3"
tokio-stream="0.1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[lints.rust]
unused_must_use = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
# pedantic and nursery are useful for catching issues but can be noisy;
# enable them selectively in CI for extra scrutiny.
# pedantic = "warn"
# nursery = "warn"

[[bin]]
name = "teleport"
path = "src/server.rs"

[[bin]]
name = "telecli"
path = "src/client.rs"
